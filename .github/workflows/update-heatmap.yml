name: update-heatmap

on:
  schedule:
    - cron: "17 6 * * *"   # her gün 06:17 UTC (09:17 TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Katkı verisini çek ve heatmap'i yeniden üret
        run: python3 scripts/update_heatmap.py

      - name: Dil dağılımını çek ve stack barlarını yeniden üret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stack_bars.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/contrib-heatmap.svg assets/stack.svg
          git diff --cached --quiet || {
            git commit -m "chore: refresh contribution heatmap [skip ci]"
            git push
          }
